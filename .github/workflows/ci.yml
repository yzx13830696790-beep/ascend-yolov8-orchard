# GitHub Actions 工作流 —— 把本文件放到 `.github/workflows/ci.yml` 即可启用。
#
# 为什么不直接放在 .github/workflows/ 下：本机托管的发布通道禁止向 .github/
# 路径写入（这部分由安全策略管控），所以配置文件先随仓库提供在这里。
# GitHub 只认 .github/workflows/ 下的 YAML，拷贝过去即刻生效，无需任何修改。
#
#   mkdir -p .github/workflows && cp docs/ci-workflow.yml .github/workflows/ci.yml
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 这里没有用 `pip install -r requirements.txt`：CI 镜像缺 libGL，
      # 非 headless 的 opencv-python 在 import cv2 时会报
      # `libGL.so.1: cannot open shared object file`。
      # headless 版提供同样的 cv2 命名空间，本项目只用图像处理，不需要 GUI 后端。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "matplotlib>=3.6" opencv-python-headless

      - name: Unit tests
        run: python -m unittest tests.test_core -v

      - name: End-to-end demo (data -> eval -> experiments -> pareto -> ATC check)
        run: python scripts/run_demo.py

      - name: Verify platform imports without Ascend hardware
        run: python -c "import sys; sys.path.insert(0,'.'); from console import jobs; print('console ok')"

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/
          if-no-files-found: warn
